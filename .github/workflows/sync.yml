name: Insta to YT - Upload Until Quota

on:
  schedule:
    # 4 times a day to finish all videos fast: 1 AM, 7 AM, 1 PM, 7 PM UTC
    - cron: '0 1,7,13,19 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run sync until quota
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PLAYLIST_TITLE: ${{ secrets.YOUTUBE_PLAYLIST_TITLE }}
          YOUTUBE_PRIVACY_STATUS: ${{ secrets.YOUTUBE_PRIVACY_STATUS }}
        run: |
          python -m src.main

      - name: Commit progress (history + counter + playlist)
        run: |
          git config --global user.name "Insta-YT Bot"
          git config --global user.email "bot@github.com"
          git add data/uploaded_history.json data/playlist_info.json data/bhavy_counter.json || true
          git diff --staged --quiet || git commit -m "Progress: quota-based sync + bhavy counter [skip ci]"
          git push || echo "No changes"
