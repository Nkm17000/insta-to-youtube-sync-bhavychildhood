name: Instagram to YouTube channel sync

on:
  push:
    branches:
      - main
    paths-ignore:
      - "data/**"
      - "**.md"
  workflow_dispatch:
  schedule:
    # UTC: 01:00, 07:00, 13:00, 19:00 (06:30, 12:30, 18:30, 00:30 India time)
    - cron: "0 1,7,13,19 * * *"

permissions:
  contents: write

concurrency:
  group: instagram-youtube-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Instagram videos to enabled YouTube channels
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate channel configuration
        run: python -m json.tool config/channels.json > /dev/null

      - name: Run sync
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_API_VERSION: ${{ vars.IG_GRAPH_API_VERSION }}
          IG_API_MODE: ${{ vars.IG_API_MODE }}
          YT1_CLIENT_ID: ${{ secrets.YT1_CLIENT_ID }}
          YT1_CLIENT_SECRET: ${{ secrets.YT1_CLIENT_SECRET }}
          YT1_REFRESH_TOKEN: ${{ secrets.YT1_REFRESH_TOKEN }}
          YT2_CLIENT_ID: ${{ secrets.YT2_CLIENT_ID }}
          YT2_CLIENT_SECRET: ${{ secrets.YT2_CLIENT_SECRET }}
          YT2_REFRESH_TOKEN: ${{ secrets.YT2_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ secrets.YOUTUBE_PRIVACY_STATUS }}
          SKIPPED_RETRY_HOURS: "24"
          # Maximum upload attempts per channel per run; skips do not consume this limit.
          MAX_ITEMS_PER_RUN: "20"
          IMAGE_VIDEO_DURATION_SECONDS: "8"
        run: |
          mkdir -p data/channel_history
          set -o pipefail
          python -u -m src.main 2>&1 | tee data/last_run.log

      - name: Commit histories and log
        if: always()
        run: |
          git config user.name "Insta-YT Bot"
          git config user.email "bot@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No history/log changes to commit."
            exit 0
          fi
          git commit -m "Update per-channel upload histories [skip ci]"
          git push
