name: Final v10 - Oldest first - Retry SKIPPED with fresh URL

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1,7,13,19 * * *'
  push:
    branches: ['**']

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install
        run: pip install -r requirements.txt
      - name: Run - Oldest first - Retry SKIPPED
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          YT1_CLIENT_ID: ${{ secrets.YT1_CLIENT_ID }}
          YT1_CLIENT_SECRET: ${{ secrets.YT1_CLIENT_SECRET }}
          YT1_REFRESH_TOKEN: ${{ secrets.YT1_REFRESH_TOKEN }}
          YT1_ENABLED: ${{ secrets.YT1_ENABLED }}
          YT2_CLIENT_ID: ${{ secrets.YT2_CLIENT_ID }}
          YT2_CLIENT_SECRET: ${{ secrets.YT2_CLIENT_SECRET }}
          YT2_REFRESH_TOKEN: ${{ secrets.YT2_REFRESH_TOKEN }}
          YT2_ENABLED: ${{ secrets.YT2_ENABLED }}
          YOUTUBE_PLAYLIST_TITLE: ${{ secrets.YOUTUBE_PLAYLIST_TITLE }}
          YOUTUBE_PLAYLIST_DESCRIPTION: ${{ secrets.YOUTUBE_PLAYLIST_DESCRIPTION }}
          YOUTUBE_PRIVACY_STATUS: ${{ secrets.YOUTUBE_PRIVACY_STATUS }}
          VIDEOS_PER_RUN: 1
          SKIPPED_RETRY_HOURS: 24
        run: python -u -m src.main 2>&1 | tee data/last_run.log; cat data/last_run.log
      - name: Commit history
        run: |
          git config --global user.name "Insta-YT Bot"
          git config --global user.email "bot@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Oldest first, retry SKIPPED with fresh URL [skip ci]" && git push || echo "No push"
