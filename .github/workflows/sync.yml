name: Instagram to YouTube channel sync

on:
  push:
    branches:
      - main
    # Run on pushes to main, except changes made only to this workflow's logs/history.
    paths-ignore:
      - 'data/**'
      - '**.md'

  workflow_dispatch:

  schedule:
    - cron: '0 1,7,13,19 * * *'

permissions:
  contents: write

concurrency:
  group: instagram-youtube-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Instagram videos to enabled YouTube channels
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate channel configuration
        run: |
          python -m json.tool config/channels.json > /dev/null
          echo "Channel configuration JSON is valid."

      - name: Run Instagram to YouTube sync
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}

          YT1_CLIENT_ID: ${{ secrets.YT1_CLIENT_ID }}
          YT1_CLIENT_SECRET: ${{ secrets.YT1_CLIENT_SECRET }}
          YT1_REFRESH_TOKEN: ${{ secrets.YT1_REFRESH_TOKEN }}

          YT2_CLIENT_ID: ${{ secrets.YT2_CLIENT_ID }}
          YT2_CLIENT_SECRET: ${{ secrets.YT2_CLIENT_SECRET }}
          YT2_REFRESH_TOKEN: ${{ secrets.YT2_REFRESH_TOKEN }}

          YOUTUBE_PRIVACY_STATUS: ${{ secrets.YOUTUBE_PRIVACY_STATUS }}
          SKIPPED_RETRY_HOURS: "24"

        run: |
          mkdir -p data
          set -o pipefail
          python -u -m src.main 2>&1 | tee data/last_run.log

      - name: Commit histories and logs
        if: always()
        run: |
          git config user.name "Insta-YT Bot"
          git config user.email "bot@github.com"

          git add -A -- data/

          if git diff --cached --quiet; then
            echo "No history or log changes to commit."
            exit 0
          fi

          git commit -m "Update per-channel upload histories [skip ci]"
          git push