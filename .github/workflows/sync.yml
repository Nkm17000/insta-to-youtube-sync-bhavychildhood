name: Instagram to YouTube channel sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1,7,13,19 * * *'
  # Deliberately no push trigger: pushing code/config should not trigger uploads.

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: instagram-youtube-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run sync
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          YT1_CLIENT_ID: ${{ secrets.YT1_CLIENT_ID }}
          YT1_CLIENT_SECRET: ${{ secrets.YT1_CLIENT_SECRET }}
          YT1_REFRESH_TOKEN: ${{ secrets.YT1_REFRESH_TOKEN }}
          YT2_CLIENT_ID: ${{ secrets.YT2_CLIENT_ID }}
          YT2_CLIENT_SECRET: ${{ secrets.YT2_CLIENT_SECRET }}
          YT2_REFRESH_TOKEN: ${{ secrets.YT2_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ secrets.YOUTUBE_PRIVACY_STATUS }}
          SKIPPED_RETRY_HOURS: '24'
        run: python -u -m src.main 2>&1 | tee data/last_run.log
      - name: Commit histories and logs
        if: always()
        run: |
          git config user.name "Insta-YT Bot"
          git config user.email "bot@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update per-channel upload histories [skip ci]"
          git push
